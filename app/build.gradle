plugins {
    alias(libs.plugins.android.application)
    // 1. AÑADE ESTA LÍNEA (Asegúrate de añadirla también en libs.versions.toml)
    id 'com.google.gms.google-services'
}
Properties properties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}
android {
    namespace 'com.example.proyecto_petconnect'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.proyecto_petconnect"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [ MAPS_API_KEY: properties.getProperty("MAPS_API_KEY", "") ]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // 2. AÑADE ESTAS DOS LÍNEAS PARA FIREBASE
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth

    implementation 'com.google.android.gms:play-services-maps:18.2.0'

    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.1.0'
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core


        // Librería oficial de Gemini
        implementation("com.google.ai.client.generativeai:generativeai:0.7.0")
        // Para manejar corrutinas (hilos)
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
    implementation("com.google.guava:guava:31.1-android")


        // Asegúrate de usar la 0.9.0 para que reconozca gemini-1.5-flash
        implementation("com.google.ai.client.generativeai:generativeai:0.9.0")
        implementation("com.google.guava:guava:31.1-android")

    implementation 'com.google.firebase:firebase-database:20.3.0'

}